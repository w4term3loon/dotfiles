# terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ',alacritty*:RGB:clipboard'
set -as terminal-features ',xterm-ghostty:RGB:clipboard'

set -g set-clipboard on
set -s extended-keys on


# interaction
set -g mouse on
set -gw mode-keys vi


# plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'thewtex/tmux-mem-cpu-load'


# status bar
set -g status-interval 1

# theme
set -g @tmux-gruvbox-statusbar-alpha 'true'
set -g @tmux-gruvbox-left-status-a '#(uname -m)'

# system monitoring
set -g @tmux-gruvbox-right-status-x "[=] #( \
    $HOME/.tmux/plugins/tmux-mem-cpu-load/tmux-mem-cpu-load -i 1 -m 2 -a 0 -g 1 \
    | sed 's/\\[.*] */]o[ /' \
)"

set -g @tmux-gruvbox-right-status-y ""
set -g @tmux-gruvbox-right-status-z 'w4term3loon #{tmux_mode_indicator}'


# preserve working directory
bind '"' split-window -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# vim-style navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# repeatable resizing
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5


# init TPM
run '~/.tmux/plugins/tpm/tpm'
